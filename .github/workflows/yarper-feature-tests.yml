name: Yarper feature tests

on:
  push:
    branches:
      - feature/custom-questions

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run repository test suite
        run: npm test
